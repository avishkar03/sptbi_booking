{% extends 'base.html' %} {% load static %}
{% block Title %} Home {% endblock %}
{% block head %}
<link rel="stylesheet" href="{% static 'css/index.css' %}" />
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" />
<link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css" />
{% endblock %} {% block title %}Home{% endblock %} {% block content %}
<!-- Modern Banner Section -->
<div class="modern-banner-container">
  <div class="modern-slideshow">
    <div class="autoplay">
      {% for banner in banners %}
      <div class="banner-slide">
        <a href="{{banner.site}}">
          <div class="banner-image-container">
            {% if banner.gif %}
              <img src="{{banner.gif.url}}" alt="Banner GIF" class="banner-media" />
            {% else %}
              <img src="{{banner.image.url}}" alt="Banner Image" class="banner-media" />
            {% endif %}
            <div class="banner-overlay"></div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
    <!-- Modern Navigation Controls -->
